name: test

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install code-search and sandbox test prerequisites
        run: |
          if ! command -v rg >/dev/null 2>&1 || ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep bubblewrap
          fi
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev --die-with-parent -- /bin/true
      # Keep strict parser deadlines; avoid competing test binaries consuming
      # their wall-clock budget while every package and race check still runs.
      - run: go test -race -p 1 ./...
      - run: go vet ./...
      - name: Verify generated language inventory
        run: go run ./scripts/language-docs -check

  # Native smoke is deliberately scoped. Unix process fixtures and Windows PTY
  # are not silently marked supported by a cross-compilation or blanket skip.
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      # runner context is unavailable in jobs.<id>.env. Export its paths after
      # the runner starts, before setup-go discovers the cache locations.
      - name: Configure isolated runtime paths
        run: |
          for key in TMPDIR TMP TEMP GOTMPDIR; do
            printf '%s=%s\n' "$key" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
          printf 'GOCACHE=%s/opcode-native-go-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s/opcode-native-go-mod\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Supported native behavior, isolated from user config and vault
        env:
          HOME: ${{ runner.temp }}/opcode-smoke-home
          USERPROFILE: ${{ runner.temp }}/opcode-smoke-home
          APPDATA: ${{ runner.temp }}/opcode-smoke-home
          LOCALAPPDATA: ${{ runner.temp }}/opcode-smoke-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/opcode-smoke-xdg
          LOCAL_ENDPOINT: ""
        run: |
          go test -count=1 ./internal/config -run '^TestNativeVault'
          go test -count=1 ./internal/permission
          go test -count=1 ./internal/llm/tools/shell -run '^TestNativeSmoke'
          go test -count=1 ./internal/tui/components/chat -run '^Test(Composer|NewlineShortcuts|EditorPreservesDraft|KeyboardSelection|TranscriptSearch|ResponseClick|Selection|MouseWheel|MessageUpdates|ProseUses)'
          go test -count=1 ./internal/tui/components/dialog -run '^Test(SettingsGeometryAtSmallAndLargeTerminalSizes|PermissionReviewModesAndFullscreenDoNotApprove|ModelLayoutAndMouseShareCompactGeometry|VaultProvider)'
          go test -count=1 ./scripts/build-release
      - name: Build native CLI and exercise first/second startup without inference
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -o bin/opcode.exe .
            go run ./scripts/platform-smoke -binary ./bin/opcode.exe
          else
            go build -trimpath -o bin/opcode .
            go run ./scripts/platform-smoke -binary ./bin/opcode
          fi
