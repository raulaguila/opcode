name: build

on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go mod download
      - run: go run ./scripts/build-release -version dev
      - uses: actions/upload-artifact@v4
        with:
          name: opcode-local-archives
          path: dist/local/*
          if-no-files-found: error
